{% load i18n static %}
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>{% trans "Barcode Labels" %} — OK Tools</title>
  <style>
    /* Print-only styles */
    @media print {
      @page { size: A4; margin: 10mm; }
      body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .no-print { display: none !important; }
      .label-grid { display: grid; grid-template-columns: repeat(3, 50mm); gap: 5mm; justify-content: center; }
      .label { width: 50mm; height: 30mm; border: 1px dashed #ccc; padding: 2mm;
               display: flex; flex-direction: column; align-items: center; justify-content: center;
               page-break-inside: avoid; break-inside: avoid; }
      .label svg { max-width: 45mm; max-height: 18mm; }
      .label .num { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; margin-top: 1mm; }
      .label .desc { font-size: 7px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45mm; }
    }
    /* Screen styles */
    @media screen {
      body { font-family: 'Inter', sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
      .no-print { margin-bottom: 20px; display: flex; gap: 10px; }
      .no-print button { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
      .btn-print { background: #2563eb; color: white; }
      .btn-back { background: #e5e7eb; color: #333; }
      .label-grid { display: grid; grid-template-columns: repeat(3, 50mm); gap: 5mm; justify-content: center; padding: 10mm; }
      .label { width: 50mm; height: 30mm; border: 1px dashed #ccc; padding: 2mm;
               display: flex; flex-direction: column; align-items: center; justify-content: center;
               background: white; }
      .label svg { max-width: 45mm; max-height: 18mm; }
      .label .num { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; margin-top: 1mm; }
      .label .desc { font-size: 7px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45mm; }
    }
  </style>
</head>
<body>
  <div class="no-print">
    <button class="btn-print" onclick="window.print()">{% trans "Print" %}</button>
    <button class="btn-back" onclick="window.history.back()">{% trans "Back" %}</button>
  </div>
  <div class="label-grid">
    {% for item in items %}
    <div class="label">
      {{ item.barcode_svg|safe }}
      <div class="num">{{ item.inventory_number }}</div>
      {% if item.description and item.description != item.inventory_number %}
      <div class="desc">{{ item.description|truncatechars:30 }}</div>
      {% endif %}
    </div>
    {% endfor %}
  </div>
</body>
</html>
