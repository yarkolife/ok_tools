{% load i18n static %}
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>{% trans "Barcode Labels" %} — OK Tools</title>
  <style>
    /* A4 sheet: 3 labels of 50x30mm per row. Shared rules first, the media
       blocks below only carry what print and screen really differ in. */
    .label-grid { display: grid; grid-template-columns: repeat(3, 50mm); gap: 5mm; justify-content: center; }
    .label { width: 50mm; height: 30mm; border: 1px dashed #ccc; padding: 2mm; box-sizing: border-box;
             display: flex; flex-direction: column; align-items: center; justify-content: center;
             overflow: hidden; font-family: 'Inter', Arial, sans-serif; }
    .label svg { display: block; max-width: 45mm; max-height: 14mm; height: auto; }
    /* One rule set for every configurable row: which line it is decides the
       weight, the row's size how large, and a run marked as a code prints
       larger still, so a shelf number reads from across the room. */
    .label .line { max-width: 45mm; line-height: 1.2; font-size: 8px;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .label .align-center { text-align: center; }
    .label .align-left { text-align: left; }
    .label .align-right { text-align: right; }
    .label .size-small { font-size: 6.5px; }
    .label .size-large { font-size: 10px; }
    .label .line-number_owner, .label .line-number { font-size: 10px; margin-bottom: .5mm; }
    .label .run-number { font-family: 'JetBrains Mono', monospace; font-weight: 600; }
    .label .run-owner { font-weight: 700; text-transform: uppercase; }
    .label .line-description { font-weight: 700; }
    .label .line-location { color: #666; }
    .label .run-code { font-size: 1.5em; font-weight: 700; color: #000; }
    /* A location is the one row allowed to wrap: its path can be long, and
       its codes are what has to stay visible. */
    .label .line-location { white-space: normal; display: -webkit-box;
                            -webkit-line-clamp: 2; line-clamp: 2;
                            -webkit-box-orient: vertical; text-overflow: clip; }

    /* Print-only styles */
    @media print {
      @page { size: A4; margin: 10mm; }
      body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .no-print { display: none !important; }
      .label { page-break-inside: avoid; break-inside: avoid; }
    }
    /* Screen styles */
    @media screen {
      body { font-family: 'Inter', sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
      .no-print { margin-bottom: 20px; display: flex; gap: 10px; }
      .no-print button { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
      .btn-print { background: #2563eb; color: white; }
      .btn-back { background: #e5e7eb; color: #333; }
      .label-grid { padding: 10mm; }
      .label { background: white; }
    }
  </style>
</head>
<body>
  <div class="no-print">
    <button class="btn-print" onclick="window.print()">{% trans "Print" %}</button>
    <button class="btn-back" onclick="window.history.back()">{% trans "Back" %}</button>
  </div>
  <div class="label-grid">
    {% for item in items %}
    <div class="label">
      {% for row in item.rows %}
      {% if row.kind == 'barcode' %}
      {{ item.barcode_svg|safe }}
      {% else %}
      <div class="line line-{{ row.content }} size-{{ row.size }} align-{{ row.align }}">
        {% for run in row.runs %}<span class="run run-{{ run.role }}">{{ run.text }}</span>{% endfor %}
      </div>
      {% endif %}
      {% endfor %}
    </div>
    {% endfor %}
  </div>
</body>
</html>
