{% extends "admin/base_site.html" %}
{% load i18n %}

{% block title %}{% trans "Barcode Labels" %}{% endblock %}

{% block content %}
<div id="barcode-modal-overlay" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center;">
  <div id="barcode-modal" style="background: white; border-radius: 8px; width: 90%; max-width: 900px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 4px 20px rgba(0,0,0,0.3);">
    <div style="padding: 16px 20px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center;">
      <h2 style="margin: 0; font-size: 18px;">{% trans "Barcode Labels" %} ({{ items_count }} {% trans "items" %})</h2>
      <button onclick="closeBarcodeModal()" style="background: none; border: none; font-size: 24px; cursor: pointer; color: #666;">&times;</button>
    </div>
    <div style="padding: 16px 20px; border-bottom: 1px solid #eee; display: flex; gap: 10px;">
      <button onclick="window.open('{{ barcode_url }}', '_blank')" style="padding: 8px 16px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer;">
        {% trans "Open in new tab" %}
      </button>
      <button onclick="printBarcodes()" style="padding: 8px 16px; background: #10b981; color: white; border: none; border-radius: 4px; cursor: pointer;">
        {% trans "Print" %}
      </button>
      <button onclick="closeBarcodeModal()" style="padding: 8px 16px; background: #e5e7eb; color: #333; border: none; border-radius: 4px; cursor: pointer;">
        {% trans "Close" %}
      </button>
    </div>
    <div style="flex: 1; overflow: auto; padding: 20px;">
      <iframe id="barcode-iframe" src="{{ barcode_url }}" style="width: 100%; height: 100%; border: none; min-height: 500px;"></iframe>
    </div>
  </div>
</div>

<script>
function closeBarcodeModal() {
  document.getElementById('barcode-modal-overlay').style.display = 'none';
  window.location.href = '{% url "admin:inventory_inventoryitem_changelist" %}';
}

function printBarcodes() {
  const iframe = document.getElementById('barcode-iframe');
  iframe.contentWindow.print();
}

// Close modal on Escape key
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeBarcodeModal();
  }
});

// Close modal when clicking outside
document.getElementById('barcode-modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) {
    closeBarcodeModal();
  }
});
</script>
{% endblock %}
