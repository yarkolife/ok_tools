[pytest]
DJANGO_SETTINGS_MODULE = ok_tools.settings
python_files = *_tests.py test_*.py tests.py
testpaths =
    registration
    licenses
    projects
    contributions
    media_files
    inventory
    rental
    tools
    austausch
    dashboard
    planung
    notifications
    ok_tools

env =
    OKTOOLS_CONFIG_FILE=test.cfg
    LANGUAGE_CODE=en
    I18N_DEFAULT_LANGUAGE=en
    DJANGO_LANGUAGE=en
    DATABASE_CONN_MAX_AGE=0
    USE_SECURE_SETTINGS=False
    DJANGO_USE_SECURE_SETTINGS=False

# NOTE: --cov must NOT be the last addopt. It takes an optional value
# (nargs='?'), and pytest appends command-line arguments after addopts,
# so a trailing --cov swallows the first positional argument
# (e.g. `pytest path/to/file.py` ran the whole testpaths suite instead).
addopts = --cov --cov-report=html --cov-report=term-missing --no-cov-on-fail --continue-on-collection-errors

# Guard against hangs (a wedged DB teardown used to block the run forever).
timeout = 300
timeout_method = thread
