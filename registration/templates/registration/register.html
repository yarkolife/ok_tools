{% extends 'base.html' %}

{% load i18n %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="col-lg-8 col-xl-6">
        <div class="card shadow-lg border-0">
            <div class="card-header text-center bg-primary text-white py-4 rounded-top">
                <div class="welcome-icon mb-3">
                    <i class="bi bi-person-plus" style="font-size: 3rem;"></i>
                </div>
                <h1 class="h2 mb-2">{% trans "Create Your Account" %}</h1>
                <p class="mb-0 opacity-75">{% trans "Join our community and start creating amazing content" %}</p>
            </div>
            <div class="card-body p-4">
                {% crispy form %}
                <div class="text-center mt-4">
                    <p class="text-muted mb-0">
                        {% trans "Already have an account?" %}
                        <a href="{% url 'login' %}" class="text-decoration-none fw-medium">{% trans "Sign in here" %}</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
