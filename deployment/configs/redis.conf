# Redis configuration file for OK Tools production
# Minimal configuration to suppress warning about missing config file

# Network
bind 0.0.0.0
protected-mode yes
port 6379

# General
daemonize no
# pidfile commented out - not needed in Docker container
# pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""

# Snapshotting
save 900 1
save 300 10
save 60 10000

# Security
# No password by default - can be set via environment variable

# Memory management
maxmemory-policy allkeys-lru

# Append only file
appendonly yes
appendfsync everysec

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

