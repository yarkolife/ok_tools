services:
  db:
    image: postgres:15
    container_name: oktools_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - oktools-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: oktools_redis
    restart: unless-stopped
    networks:
      - oktools-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../
      dockerfile: deployment/production.Dockerfile
    container_name: oktools_web
    ports:
      - "8010:8000"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ok_tools.settings
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/static:/app/static
      - ./data/media:/app/media
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./deployment:/app/deployment:ro
    restart: unless-stopped
    networks:
      - oktools-network

  nginx:
    image: nginx:alpine
    container_name: oktools_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./data/static:/var/www/static:ro
      - ./data/media:/var/www/media:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./deployment/nginx-entrypoint.sh:/docker-entrypoint.d/nginx-entrypoint.sh:ro
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    depends_on:
      - web
      - certbot
    restart: unless-stopped
    networks:
      - oktools-network

  certbot:
    image: certbot/certbot
    container_name: oktools_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait ${!}; done;'"
    depends_on:
      - web

  celery_worker:
    build:
      context: ../
      dockerfile: deployment/production.Dockerfile
    container_name: oktools_celery_worker
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ok_tools.settings
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/static:/app/static
      - ./data/media:/app/media
      - ./logs:/app/logs
    command: celery -A ok_tools worker --loglevel=info
    restart: unless-stopped
    networks:
      - oktools-network

  celery_beat:
    build:
      context: ../
      dockerfile: deployment/production.Dockerfile
    container_name: oktools_celery_beat
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: ok_tools.settings
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    command: celery -A ok_tools beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped
    networks:
      - oktools-network
volumes:
  postgres_data:
  static_files:
  media_files:
  logs:
  backups:


networks:
  oktools-network:
    driver: bridge