{% extends "admin/change_list.html" %}
{% load i18n static %}

{% block extrahead %}
{{ block.super }}
<style>
    /* Modal styles */
    .video-modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0,0,0,0.8);
    }
    .video-modal-content {
        background-color: #fefefe;
        margin: 2% auto;
        padding: 0;
        border-radius: 8px;
        width: 90%;
        max-width: 1200px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .video-modal-header {
        background: #417690;
        color: white;
        padding: 15px 20px;
        border-radius: 8px 8px 0 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .video-modal-header h2 {
        margin: 0;
        font-size: 18px;
    }
    .video-modal-close {
        color: white;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
    }
    .video-modal-close:hover {
        opacity: 0.7;
    }
    .video-modal-body {
        padding: 20px;
    }
    .video-modal video {
        width: 100%;
        height: 600px;
        border: none;
        border-radius: 8px;
        background: #000;
    }
</style>
{% endblock %}

{% block content %}
{{ block.super }}

<!-- Video Modal -->
<div id="videoModal" class="video-modal">
    <div class="video-modal-content">
        <div class="video-modal-header">
            <h2 id="modalTitle">Video Player</h2>
            <span class="video-modal-close" onclick="closeVideoModal()">&times;</span>
        </div>
        <div class="video-modal-body">
            <div class="video-modal-info" style="margin-bottom: 15px; padding: 15px; background: #f8f9fa; border-radius: 4px; border-left: 4px solid #007bff;">
                <div style="font-size: 13px; color: #333;">
                    <p style="margin: 5px 0;"><strong>📁 File:</strong> <span id="modalFileName"></span></p>
                    <p style="margin: 5px 0;"><strong>🔢 Number:</strong> <span id="modalNumber"></span></p>
                    <p style="margin: 5px 0;"><strong>💾 Storage:</strong> <span id="modalStorage"></span></p>
                    <p style="margin: 5px 0;"><strong>⏱️ Duration:</strong> <span id="modalDuration"></span></p>
                    <p style="margin: 5px 0;"><strong>📊 Size:</strong> <span id="modalSize"></span></p>
                    <p style="margin: 5px 0;"><strong>📡 Bitrate:</strong> <span id="modalBitrate"></span></p>
                </div>
            </div>
            
            <video 
                id="modalVideoFrame"
                controls 
                preload="metadata"
                style="border-radius: 8px; background: #000;">
                Your browser does not support the video tag.
            </video>
        </div>
    </div>
</div>

<script>
function openVideoModal(streamUrl, filename, number, storage, duration, size, bitrate) {
    const modal = document.getElementById('videoModal');
    const title = document.getElementById('modalTitle');
    const video = document.getElementById('modalVideoFrame');
    
    // Set title
    title.textContent = filename;
    
    // Fill video information
    document.getElementById('modalFileName').textContent = filename;
    document.getElementById('modalNumber').textContent = number;
    document.getElementById('modalStorage').textContent = storage;
    document.getElementById('modalDuration').textContent = duration;
    document.getElementById('modalSize').textContent = size;
    document.getElementById('modalBitrate').textContent = bitrate;
    
    // Set video source
    video.src = streamUrl;
    modal.style.display = 'block';
}

function closeVideoModal() {
    const modal = document.getElementById('videoModal');
    const video = document.getElementById('modalVideoFrame');
    
    modal.style.display = 'none';
    video.pause(); // Stop video
    video.src = ''; // Clear source
}

// Close modal when clicking outside
window.onclick = function(event) {
    const modal = document.getElementById('videoModal');
    if (event.target == modal) {
        closeVideoModal();
    }
}

// Close modal with Escape key
document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
        closeVideoModal();
    }
});
</script>
{% endblock %}
