[pytest]
DJANGO_SETTINGS_MODULE = ok_tools.settings
python_files = *_tests.py
testpaths =
    registration
    licenses
    projects
    contributions
    media_files

env =
    OKTOOLS_CONFIG_FILE=test.cfg
    LANGUAGE_CODE=en
    I18N_DEFAULT_LANGUAGE=en
    DJANGO_LANGUAGE=en
    DATABASE_CONN_MAX_AGE=0
    USE_SECURE_SETTINGS=False
    DJANGO_USE_SECURE_SETTINGS=False

addopts = --cov-report=html --cov-report=term-missing --no-cov-on-fail --cov
