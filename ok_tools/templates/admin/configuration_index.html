{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<style>
  .cfg { max-width: 1100px; display: grid; gap: 12px;
         grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .cfg a { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; text-decoration: none;
           background: var(--ok-surface, #fff); border: 1px solid var(--ok-line, #ddd);
           border-radius: var(--ok-radius-lg, 8px); color: var(--ok-ink, #222); }
  .cfg a:hover { border-color: var(--ok-brand, #417690); }
  .cfg a:hover .cfg-title { color: var(--ok-brand, #417690); }
  .cfg-app { font-size: 12px; color: var(--ok-ink-3, #666); text-transform: uppercase; letter-spacing: .04em; }
  .cfg-title { font-size: 15px; font-weight: 600; }
  .cfg-empty { color: var(--ok-ink-3, #666); }
</style>

{% if config_links %}
  <div class="cfg">
    {% for link in config_links %}
      <a href="{{ link.url }}">
        <span class="cfg-app">{{ link.app }}</span>
        <span class="cfg-title">{{ link.title }}</span>
      </a>
    {% endfor %}
  </div>
{% else %}
  <p class="cfg-empty">{% translate "There are no settings you may change." %}</p>
{% endif %}
{% endblock %}
