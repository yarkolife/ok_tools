{% load i18n %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'de' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>{{ title }} — OK Tools</title>
  <style>
    :root { --bg: #f4f6f8; --card: #fff; --ink: #1d2733; --ink-2: #5b6673; --line: #dde3e9;
            --field: #fff; --brand: #1d5d7a; --ok: #0a6b2d; --bad: #c62828; --warn: #8a5a00; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #11161c; --card: #1a2129; --ink: #e8edf2; --ink-2: #9aa6b2; --line: #2c3743;
              --field: #141a21; --brand: #5aa2c4; --ok: #6fd08f; --bad: #ff8a80; --warn: #e7c46b; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 14px; }
    h1 { font-size: 1.25rem; margin: 0 0 12px; }
    h2 { font-size: 1rem; margin: 0 0 8px; }
    .meta, .help { color: var(--ink-2); font-size: 13px; }
    label { display: block; font-weight: 600; margin: 14px 0 4px; }
    input[type=text], input[type=url], input[type=datetime-local], select, textarea {
      width: 100%; padding: 10px 12px; font: inherit; color: var(--ink); background: var(--field);
      border: 1px solid var(--line); border-radius: 8px; }
    textarea { resize: vertical; }
    input[type=file] { width: 100%; font: inherit; }
    .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; }
    .check input { margin-top: 4px; width: 20px; height: 20px; flex: 0 0 auto; }
    .choices { display: flex; flex-wrap: wrap; gap: 8px 18px; }
    .choices label { display: inline-flex; gap: 8px; align-items: center; font-weight: 400; margin: 6px 0; }
    .errorlist { color: var(--bad); margin: 4px 0 0; padding: 0; list-style: none; font-size: 14px; }
    button, .button { display: block; width: 100%; margin-top: 16px; padding: 13px; border: 0; border-radius: 8px;
             background: var(--brand); color: #fff; font: 600 16px/1.2 inherit; text-align: center;
             text-decoration: none; cursor: pointer; }
    button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
    .photos img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; display: block; }
    .photos.natural img { aspect-ratio: auto; max-height: 160px; object-fit: contain; background: var(--line); }
    .photos.ig { margin-bottom: 10px; }
    .photos.ig img { aspect-ratio: 4 / 5; }
    .row-link { display: block; padding: 10px 0; border-top: 1px solid var(--line); color: var(--ink); text-decoration: none; }
    .row-link:first-of-type { border-top: 0; }
    .row-link .meta, .row-link .problems { display: block; }
    .topnav { display: flex; justify-content: space-between; margin: 0 2px 10px; font-size: 14px; }
    .text { white-space: pre-wrap; border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 14px; }
    .state-done h1 { color: var(--ok); }
    .state-invalid h1, .state-error h1 { color: var(--bad); }
    .problems { color: var(--warn); }
    a { color: var(--brand); }
  </style>
</head>
<body>
<main>
{% if user.is_authenticated and state != 'invalid' %}<nav class="topnav"><a href="{% url 'beitraege:meine' %}">{% trans "My posts" %}</a>{% if perms.beitraege.add_beitrag %}<a href="{% url 'beitraege:neu' %}">{% trans "New post" %}</a>{% endif %}</nav>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
