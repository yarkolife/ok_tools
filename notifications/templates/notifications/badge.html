{% load i18n %}
<a href="{% url 'admin:notifications_feed' %}" class="notifications-badge"
   title="{% translate 'Notifications' %}">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
  </svg>
  <span class="visually-hidden">{% translate 'Notifications' %}</span>
  {% if count %}<span class="notifications-badge-count">{{ count }}</span>
  {% elif new_count %}<span class="notifications-badge-dot" aria-hidden="true"></span>{% endif %}
</a>
