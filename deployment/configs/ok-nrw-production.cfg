# Production Configuration for OK NRW

[organization]
name = Offener Kanal Nordrhein-Westfalen e.V.
short_name = OK NRW
website = https://ok-nrw.de
email = info@ok-nrw.de
address = Rundfunkstraße 456
    40213 Düsseldorf
    Nordrhein-Westfalen
phone = +49 211 123456
fax = +49 211 123457
description = Willkommen beim Offenen Kanal NRW! Wir sind ein gemeinnütziger Bürgermedien-Verein in Düsseldorf.
    Bei uns können Sie eigene TV- und Radiosendungen produzieren und professionelle Equipment nutzen.
opening_hours = Mo: 13:00 – 16:00
    Di – Do: 10:00 – 18:00
    Fr: 10:00 – 16:00
    (oder nach Vereinbarung)
state_media_institution = LfM NRW
organization_owner = OK NRW

# Broadcast block time settings (format HH:MM)
broadcast_start = 18:00
broadcast_end = 19:45

# PeerTube channel (optional)
# Format: @handle@domain.com (ActivityPub/Fediverse format)
# Example: @oknrw@peertube.ok-nrw.de
peertube_channel = 

[django]
secret_key = YOUR-PRODUCTION-SECRET-KEY-HERE
debug = False
allowed_hosts = ok-nrw.de www.ok-nrw.de
db_name = oktools_nrw
db_user = oktools
db_pw = YOUR-DATABASE-PASSWORD
db_host = localhost
db_port = 5432
language = de-de
timezone = Europe/Berlin
static = /opt/ok-tools/static/
media = /opt/ok-tools/media/
email_host = smtp.your-provider.de
email_port = 587
email_use_tls = True
email_host_user = noreply@ok-nrw.de
email_host_password = YOUR-SMTP-PASSWORD
default_from_email = noreply@ok-nrw.de
mail_dev_settings = False
use_secure_settings = True

[media]
# Video file management - NAS storage paths
# Archive and playout can be on different network shares
# Paths should point to mounted CIFS/SMB shares

# Archive path - long-term video storage
# Example: archive_path = /mnt/nas/archive/
archive_path = /mnt/nas/archive/

# Playout path - videos ready for broadcast
# Example: playout_path = /mnt/nas/playout/
playout_path = /mnt/nas/playout/

# Auto-scan storage locations for new files on startup
auto_scan = False

# Auto-copy videos to playout when broadcast plan is saved
auto_copy_on_schedule = True

[logging]
level = INFO
file = /app/logs/oktools.log

bootstrap]
# Bootstrap CSS framework version
version = 5.3.3

# Bootstrap Icons version
icons_version = 1.11.0

[api]
# REST API pagination
page_size = 20

# Rate limiting for anonymous users
anon_rate_limit = 100/hour

# Rate limiting for authenticated users
user_rate_limit = 1000/hour

[security]
# Session timeout in seconds (20 minutes)
session_timeout = 1200

# Minimum password length
password_min_length = 8

# CSRF cookie age in seconds (1 year)
csrf_cookie_age = 31449600

[video]
# Supported video formats (comma-separated)
supported_formats = mp4,mov,mpeg,mpg

# Duration of screen board in seconds
screen_board_duration = 20

[i18n]
# Default language code
default_language = de

# Supported languages (comma-separated)
supported_languages = de,en

# Locale paths (comma-separated)
locale_paths = ok_tools/locale

phone_region = DE
date_format = %%d.%%m.%%Y

[static]
# Static files storage backend
storage_backend = whitenoise.storage.CompressedManifestStaticFilesStorage

# Static URL prefix
static_url = static/

[cache]
# Cache backend
backend = django.core.cache.backends.locmem.LocMemCache

# Cache timeout in seconds
timeout = 300

[celery]
# Celery broker URL (Redis)
broker_url = redis://localhost:6379/0

# Celery result backend (Redis)
result_backend = redis://localhost:6379/0

[celery_beat]
# Schedule for expiring rentals. Format: minute hour day_of_week day_of_month month_of_year
# '*/30 * * *' means "every 30 minutes"
expire_rentals_schedule = */30 * *

# Schedule for cleaning up old backups.
# '0 2 * *' means "every day at 2:00 AM"
cleanup_old_backups_schedule = 0 2 * * *

# Schedule for running the database backup.
# '0 3 * * *' means "every day at 3:00 AM"
run_backup_db_schedule = 0 3 * * *

# Schedule for media files management
# (every 2 hours)
auto_scan_schedule = 0 */2 * * *
# (daily at 4:00 AM)
link_orphan_licenses_schedule = 0 4 * * *
# (daily at 5:00 AM)
sync_licenses_videos_schedule = 0 5 * * *
# (monthly, 1st day at 1:00 AM) with --missing-only
update_video_metadata_schedule = 0 1 1 * *