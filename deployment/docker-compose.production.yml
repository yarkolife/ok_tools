services:
  db:
    image: postgres:15
    container_name: oktools_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - oktools-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: oktools_redis
    restart: unless-stopped
    networks:
      - oktools-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oktools_web
    ports:
      - "8000:8000"
    environment:
      # Core Django
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=${DEBUG}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      
      # Django Extended
      - DJANGO_LOG_LEVEL=${DJANGO_LOG_LEVEL:-INFO}
      - DJANGO_LANGUAGE=${DJANGO_LANGUAGE:-de-de}
      - DJANGO_TIMEZONE=${DJANGO_TIMEZONE:-Europe/Berlin}
      - DJANGO_STATIC_ROOT=${DJANGO_STATIC_ROOT:-/app/staticfiles/}
      - DJANGO_MEDIA_ROOT=${DJANGO_MEDIA_ROOT:-/app/media/}
      - DJANGO_USE_SECURE_SETTINGS=${DJANGO_USE_SECURE_SETTINGS:-True}
      
      # Database Extended
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      
      # Email Configuration
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
      - MAIL_DEV_SETTINGS=${MAIL_DEV_SETTINGS:-False}
      
      # Organization Configuration
      - ORG_NAME=${ORG_NAME}
      - ORG_SHORT_NAME=${ORG_SHORT_NAME}
      - ORG_WEBSITE=${ORG_WEBSITE}
      - ORG_EMAIL=${ORG_EMAIL}
      - ORG_PHONE=${ORG_PHONE}
      - ORG_ADDRESS=${ORG_ADDRESS}
      - ORG_ORGANIZATION_OWNER=${ORG_ORGANIZATION_OWNER:-}
      - ORG_BROADCAST_START=${ORG_BROADCAST_START:-18:00}
      - ORG_BROADCAST_END=${ORG_BROADCAST_END:-19:45}
      - ORG_PEERTUBE_CHANNEL=${ORG_PEERTUBE_CHANNEL:-}
      
      # NAS Storage Configuration
      - NAS_ARCHIVE_UNC_PATH=${NAS_ARCHIVE_UNC_PATH:-}
      - NAS_PLAYOUT_UNC_PATH=${NAS_PLAYOUT_UNC_PATH:-}
      - MEDIA_AUTO_SCAN=${MEDIA_AUTO_SCAN:-False}
      - MEDIA_AUTO_COPY_ON_SCHEDULE=${MEDIA_AUTO_COPY_ON_SCHEDULE:-True}
      
      # Logging Configuration
      - LOG_LEVEL=${LOG_LEVEL}
      - LOGGING_FILE=${LOGGING_FILE:-/app/logs/oktools.log}
      
      # Bootstrap Configuration
      - BOOTSTRAP_VERSION=${BOOTSTRAP_VERSION:-5.3.3}
      - BOOTSTRAP_ICONS_VERSION=${BOOTSTRAP_ICONS_VERSION:-1.11.0}
      
      # API Configuration
      - API_PAGE_SIZE=${API_PAGE_SIZE:-20}
      - API_ANON_RATE_LIMIT=${API_ANON_RATE_LIMIT:-100/hour}
      - API_USER_RATE_LIMIT=${API_USER_RATE_LIMIT:-1000/hour}
      
      # Security Configuration
      - SECURITY_SESSION_TIMEOUT=${SECURITY_SESSION_TIMEOUT:-1200}
      - SECURITY_PASSWORD_MIN_LENGTH=${SECURITY_PASSWORD_MIN_LENGTH:-8}
      - SECURITY_CSRF_COOKIE_AGE=${SECURITY_CSRF_COOKIE_AGE:-31449600}
      
      # Video Configuration
      - VIDEO_SUPPORTED_FORMATS=${VIDEO_SUPPORTED_FORMATS:-mp4,mov,mpeg,mpg}
      - VIDEO_SCREEN_BOARD_DURATION=${VIDEO_SCREEN_BOARD_DURATION:-20}
      
      # I18n Configuration
      - I18N_DEFAULT_LANGUAGE=${I18N_DEFAULT_LANGUAGE:-de}
      - I18N_SUPPORTED_LANGUAGES=${I18N_SUPPORTED_LANGUAGES:-de,en}
      - I18N_LOCALE_PATHS=${I18N_LOCALE_PATHS:-ok_tools/locale}
      - I18N_PHONE_REGION=${I18N_PHONE_REGION:-DE}
      - I18N_DATE_FORMAT=${I18N_DATE_FORMAT:-%d.%m.%Y}
      
      # Static Files Configuration
      - STATIC_STORAGE_BACKEND=${STATIC_STORAGE_BACKEND:-whitenoise.storage.CompressedManifestStaticFilesStorage}
      - STATIC_URL_PREFIX=${STATIC_URL_PREFIX:-static/}
      
      # Cache Configuration
      - CACHE_BACKEND=${CACHE_BACKEND:-django.core.cache.backends.locmem.LocMemCache}
      - CACHE_TIMEOUT=${CACHE_TIMEOUT:-300}
      
      # Celery Configuration
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      
      # Celery Beat Schedules
      - CELERY_BEAT_EXPIRE_RENTALS=${CELERY_BEAT_EXPIRE_RENTALS:-*/30 * * * *}
      - CELERY_BEAT_CLEANUP_BACKUPS=${CELERY_BEAT_CLEANUP_BACKUPS:-0 2 * * *}
      - CELERY_BEAT_BACKUP_DB=${CELERY_BEAT_BACKUP_DB:-0 3 * * *}
      - CELERY_BEAT_AUTO_SCAN=${CELERY_BEAT_AUTO_SCAN:-0 */2 * * *}
      - CELERY_BEAT_LINK_LICENSES=${CELERY_BEAT_LINK_LICENSES:-0 4 * * *}
      - CELERY_BEAT_SYNC_VIDEOS=${CELERY_BEAT_SYNC_VIDEOS:-0 5 * * *}
      - CELERY_BEAT_UPDATE_METADATA=${CELERY_BEAT_UPDATE_METADATA:-0 1 1 * *}
      
      # System Configuration
      - STATE_MEDIA_INSTITUTION=${STATE_MEDIA_INSTITUTION}
      - SUPERUSER_USERNAME=${SUPERUSER_USERNAME}
      - SUPERUSER_EMAIL=${SUPERUSER_EMAIL}
      - SUPERUSER_PASSWORD=${SUPERUSER_PASSWORD}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS}
      - GUNICORN_THREADS=${GUNICORN_THREADS}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT}
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
      
      # Deprecated - for backward compatibility
      - OKTOOLS_CONFIG_FILE=${OKTOOLS_CONFIG_FILE:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/static:/app/static
      - ./data/media:/app/media
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./deployment:/app/deployment:ro
    entrypoint: /app/deployment/entrypoint.production.sh
    restart: unless-stopped
    networks:
      - oktools-network

  nginx:
    image: nginx:alpine
    container_name: oktools_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./data/static:/var/www/static:ro
      - ./data/media:/var/www/media:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /app/deployment/nginx-entrypoint.sh
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    depends_on:
      - web
      - certbot
    restart: unless-stopped
    networks:
      - oktools-network

  certbot:
    image: certbot/certbot
    container_name: oktools_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait ${!}; done;'"
    depends_on:
      - web

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oktools_celery_worker
    environment:
      # Core Django
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      
      # Django Extended
      - DJANGO_LOG_LEVEL=${DJANGO_LOG_LEVEL:-INFO}
      - DJANGO_LANGUAGE=${DJANGO_LANGUAGE:-de-de}
      - DJANGO_TIMEZONE=${DJANGO_TIMEZONE:-Europe/Berlin}
      - DJANGO_STATIC_ROOT=${DJANGO_STATIC_ROOT:-/app/staticfiles/}
      - DJANGO_MEDIA_ROOT=${DJANGO_MEDIA_ROOT:-/app/media/}
      - DJANGO_USE_SECURE_SETTINGS=${DJANGO_USE_SECURE_SETTINGS:-True}
      
      # Database Extended
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      
      # Email Configuration
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
      - MAIL_DEV_SETTINGS=${MAIL_DEV_SETTINGS:-False}
      
      # Organization Configuration
      - ORG_NAME=${ORG_NAME}
      - ORG_SHORT_NAME=${ORG_SHORT_NAME}
      - ORG_WEBSITE=${ORG_WEBSITE}
      - ORG_EMAIL=${ORG_EMAIL}
      - ORG_PHONE=${ORG_PHONE}
      - ORG_ADDRESS=${ORG_ADDRESS}
      - ORG_ORGANIZATION_OWNER=${ORG_ORGANIZATION_OWNER:-}
      - ORG_BROADCAST_START=${ORG_BROADCAST_START:-18:00}
      - ORG_BROADCAST_END=${ORG_BROADCAST_END:-19:45}
      - ORG_PEERTUBE_CHANNEL=${ORG_PEERTUBE_CHANNEL:-}
      
      # NAS Storage Configuration
      - NAS_ARCHIVE_UNC_PATH=${NAS_ARCHIVE_UNC_PATH:-}
      - NAS_PLAYOUT_UNC_PATH=${NAS_PLAYOUT_UNC_PATH:-}
      - MEDIA_AUTO_SCAN=${MEDIA_AUTO_SCAN:-False}
      - MEDIA_AUTO_COPY_ON_SCHEDULE=${MEDIA_AUTO_COPY_ON_SCHEDULE:-True}
      
      # Logging Configuration
      - LOGGING_FILE=${LOGGING_FILE:-/app/logs/oktools.log}
      
      # Bootstrap Configuration
      - BOOTSTRAP_VERSION=${BOOTSTRAP_VERSION:-5.3.3}
      - BOOTSTRAP_ICONS_VERSION=${BOOTSTRAP_ICONS_VERSION:-1.11.0}
      
      # API Configuration
      - API_PAGE_SIZE=${API_PAGE_SIZE:-20}
      - API_ANON_RATE_LIMIT=${API_ANON_RATE_LIMIT:-100/hour}
      - API_USER_RATE_LIMIT=${API_USER_RATE_LIMIT:-1000/hour}
      
      # Security Configuration
      - SECURITY_SESSION_TIMEOUT=${SECURITY_SESSION_TIMEOUT:-1200}
      - SECURITY_PASSWORD_MIN_LENGTH=${SECURITY_PASSWORD_MIN_LENGTH:-8}
      - SECURITY_CSRF_COOKIE_AGE=${SECURITY_CSRF_COOKIE_AGE:-31449600}
      
      # Video Configuration
      - VIDEO_SUPPORTED_FORMATS=${VIDEO_SUPPORTED_FORMATS:-mp4,mov,mpeg,mpg}
      - VIDEO_SCREEN_BOARD_DURATION=${VIDEO_SCREEN_BOARD_DURATION:-20}
      
      # I18n Configuration
      - I18N_DEFAULT_LANGUAGE=${I18N_DEFAULT_LANGUAGE:-de}
      - I18N_SUPPORTED_LANGUAGES=${I18N_SUPPORTED_LANGUAGES:-de,en}
      - I18N_LOCALE_PATHS=${I18N_LOCALE_PATHS:-ok_tools/locale}
      - I18N_PHONE_REGION=${I18N_PHONE_REGION:-DE}
      - I18N_DATE_FORMAT=${I18N_DATE_FORMAT:-%d.%m.%Y}
      
      # Static Files Configuration
      - STATIC_STORAGE_BACKEND=${STATIC_STORAGE_BACKEND:-whitenoise.storage.CompressedManifestStaticFilesStorage}
      - STATIC_URL_PREFIX=${STATIC_URL_PREFIX:-static/}
      
      # Cache Configuration
      - CACHE_BACKEND=${CACHE_BACKEND:-django.core.cache.backends.locmem.LocMemCache}
      - CACHE_TIMEOUT=${CACHE_TIMEOUT:-300}
      
      # Celery Configuration
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      
      # Celery Beat Schedules
      - CELERY_BEAT_EXPIRE_RENTALS=${CELERY_BEAT_EXPIRE_RENTALS:-*/30 * * * *}
      - CELERY_BEAT_CLEANUP_BACKUPS=${CELERY_BEAT_CLEANUP_BACKUPS:-0 2 * * *}
      - CELERY_BEAT_BACKUP_DB=${CELERY_BEAT_BACKUP_DB:-0 3 * * *}
      - CELERY_BEAT_AUTO_SCAN=${CELERY_BEAT_AUTO_SCAN:-0 */2 * * *}
      - CELERY_BEAT_LINK_LICENSES=${CELERY_BEAT_LINK_LICENSES:-0 4 * * *}
      - CELERY_BEAT_SYNC_VIDEOS=${CELERY_BEAT_SYNC_VIDEOS:-0 5 * * *}
      - CELERY_BEAT_UPDATE_METADATA=${CELERY_BEAT_UPDATE_METADATA:-0 1 1 * *}
      
      # System Configuration
      - STATE_MEDIA_INSTITUTION=${STATE_MEDIA_INSTITUTION}
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
      
      # Deprecated - for backward compatibility
      - OKTOOLS_CONFIG_FILE=${OKTOOLS_CONFIG_FILE:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../ok_tools:/app
      - ./data/static:/app/static
      - ./data/media:/app/media
      - ./logs:/app/logs
    command: celery -A ok_tools worker --loglevel=info
    restart: unless-stopped
    networks:
      - oktools-network

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oktools_celery_beat
    environment:
      # Core Django
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      
      # Django Extended
      - DJANGO_LOG_LEVEL=${DJANGO_LOG_LEVEL:-INFO}
      - DJANGO_LANGUAGE=${DJANGO_LANGUAGE:-de-de}
      - DJANGO_TIMEZONE=${DJANGO_TIMEZONE:-Europe/Berlin}
      - DJANGO_STATIC_ROOT=${DJANGO_STATIC_ROOT:-/app/staticfiles/}
      - DJANGO_MEDIA_ROOT=${DJANGO_MEDIA_ROOT:-/app/media/}
      - DJANGO_USE_SECURE_SETTINGS=${DJANGO_USE_SECURE_SETTINGS:-True}
      
      # Database Extended
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      
      # Email Configuration
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
      - MAIL_DEV_SETTINGS=${MAIL_DEV_SETTINGS:-False}
      
      # Organization Configuration
      - ORG_NAME=${ORG_NAME}
      - ORG_SHORT_NAME=${ORG_SHORT_NAME}
      - ORG_WEBSITE=${ORG_WEBSITE}
      - ORG_EMAIL=${ORG_EMAIL}
      - ORG_PHONE=${ORG_PHONE}
      - ORG_ADDRESS=${ORG_ADDRESS}
      - ORG_ORGANIZATION_OWNER=${ORG_ORGANIZATION_OWNER:-}
      - ORG_BROADCAST_START=${ORG_BROADCAST_START:-18:00}
      - ORG_BROADCAST_END=${ORG_BROADCAST_END:-19:45}
      - ORG_PEERTUBE_CHANNEL=${ORG_PEERTUBE_CHANNEL:-}
      
      # NAS Storage Configuration
      - NAS_ARCHIVE_UNC_PATH=${NAS_ARCHIVE_UNC_PATH:-}
      - NAS_PLAYOUT_UNC_PATH=${NAS_PLAYOUT_UNC_PATH:-}
      - MEDIA_AUTO_SCAN=${MEDIA_AUTO_SCAN:-False}
      - MEDIA_AUTO_COPY_ON_SCHEDULE=${MEDIA_AUTO_COPY_ON_SCHEDULE:-True}
      
      # Logging Configuration
      - LOGGING_FILE=${LOGGING_FILE:-/app/logs/oktools.log}
      
      # Bootstrap Configuration
      - BOOTSTRAP_VERSION=${BOOTSTRAP_VERSION:-5.3.3}
      - BOOTSTRAP_ICONS_VERSION=${BOOTSTRAP_ICONS_VERSION:-1.11.0}
      
      # API Configuration
      - API_PAGE_SIZE=${API_PAGE_SIZE:-20}
      - API_ANON_RATE_LIMIT=${API_ANON_RATE_LIMIT:-100/hour}
      - API_USER_RATE_LIMIT=${API_USER_RATE_LIMIT:-1000/hour}
      
      # Security Configuration
      - SECURITY_SESSION_TIMEOUT=${SECURITY_SESSION_TIMEOUT:-1200}
      - SECURITY_PASSWORD_MIN_LENGTH=${SECURITY_PASSWORD_MIN_LENGTH:-8}
      - SECURITY_CSRF_COOKIE_AGE=${SECURITY_CSRF_COOKIE_AGE:-31449600}
      
      # Video Configuration
      - VIDEO_SUPPORTED_FORMATS=${VIDEO_SUPPORTED_FORMATS:-mp4,mov,mpeg,mpg}
      - VIDEO_SCREEN_BOARD_DURATION=${VIDEO_SCREEN_BOARD_DURATION:-20}
      
      # I18n Configuration
      - I18N_DEFAULT_LANGUAGE=${I18N_DEFAULT_LANGUAGE:-de}
      - I18N_SUPPORTED_LANGUAGES=${I18N_SUPPORTED_LANGUAGES:-de,en}
      - I18N_LOCALE_PATHS=${I18N_LOCALE_PATHS:-ok_tools/locale}
      - I18N_PHONE_REGION=${I18N_PHONE_REGION:-DE}
      - I18N_DATE_FORMAT=${I18N_DATE_FORMAT:-%d.%m.%Y}
      
      # Static Files Configuration
      - STATIC_STORAGE_BACKEND=${STATIC_STORAGE_BACKEND:-whitenoise.storage.CompressedManifestStaticFilesStorage}
      - STATIC_URL_PREFIX=${STATIC_URL_PREFIX:-static/}
      
      # Cache Configuration
      - CACHE_BACKEND=${CACHE_BACKEND:-django.core.cache.backends.locmem.LocMemCache}
      - CACHE_TIMEOUT=${CACHE_TIMEOUT:-300}
      
      # Celery Configuration
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      
      # Celery Beat Schedules
      - CELERY_BEAT_EXPIRE_RENTALS=${CELERY_BEAT_EXPIRE_RENTALS:-*/30 * * * *}
      - CELERY_BEAT_CLEANUP_BACKUPS=${CELERY_BEAT_CLEANUP_BACKUPS:-0 2 * * *}
      - CELERY_BEAT_BACKUP_DB=${CELERY_BEAT_BACKUP_DB:-0 3 * * *}
      - CELERY_BEAT_AUTO_SCAN=${CELERY_BEAT_AUTO_SCAN:-0 */2 * * *}
      - CELERY_BEAT_LINK_LICENSES=${CELERY_BEAT_LINK_LICENSES:-0 4 * * *}
      - CELERY_BEAT_SYNC_VIDEOS=${CELERY_BEAT_SYNC_VIDEOS:-0 5 * * *}
      - CELERY_BEAT_UPDATE_METADATA=${CELERY_BEAT_UPDATE_METADATA:-0 1 1 * *}
      
      # System Configuration
      - STATE_MEDIA_INSTITUTION=${STATE_MEDIA_INSTITUTION}
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
      
      # Deprecated - for backward compatibility
      - OKTOOLS_CONFIG_FILE=${OKTOOLS_CONFIG_FILE:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../ok_tools:/app
      - ./logs:/app/logs
    command: celery -A ok_tools beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    restart: unless-stopped
    networks:
      - oktools-network
volumes:
  postgres_data:
  static_files:
  media_files:
  logs:
  backups:


networks:
  oktools-network:
    driver: bridge