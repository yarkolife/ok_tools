services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: oktools
      POSTGRES_USER: oktools
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oktools_production_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - oktools-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - oktools-network

  web:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.production
    environment:
      - OKTOOLS_CONFIG_FILE=/app/docker-production.cfg
      - DJANGO_SETTINGS_MODULE=ok_tools.settings
    depends_on:
      - db
      - redis
    volumes:
      - ../../docker-production.cfg:/app/docker-production.cfg:ro
      - static_files:/app/static
      - media_files:/app/media
      - logs:/app/logs
    restart: unless-stopped
    networks:
      - oktools-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/var/www/static:ro
      - media_files:/var/www/media:ro
      - ./ssl:/etc/nginx/ssl:ro  # Place SSL certificates here
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - oktools-network

  cron:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.production
    environment:
      - OKTOOLS_CONFIG_FILE=/app/docker-production.cfg
      - DJANGO_SETTINGS_MODULE=ok_tools.settings
    depends_on:
      - db
      - web
    volumes:
      - ../../docker-production.cfg:/app/docker-production.cfg:ro
      - logs:/app/logs
    command: |
      sh -c "
        echo '*/30 * * * * cd /app && python scripts/run_expire_rentals.py >> /app/logs/expire_rentals.log 2>&1' > /etc/cron.d/expire_rentals &&
        chmod 0644 /etc/cron.d/expire_rentals &&
        touch /app/logs/expire_rentals.log &&
        service cron start &&
        tail -f /app/logs/expire_rentals.log
      "
    restart: unless-stopped
    networks:
      - oktools-network

volumes:
  postgres_data:
  static_files:
  media_files:
  logs:

networks:
  oktools-network:
    driver: bridge
