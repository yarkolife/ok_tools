{% extends "admin/base_site.html" %}
{% load i18n %}

{% block title %}{% trans "Barcode Labels" %}{% endblock %}

{% block content %}
<div class="modal" id="barcode-modal" tabindex="-1" style="display: flex; background: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-lg" style="max-width: 960px;">
    <div class="modal-content">
      <div class="modal-header" style="background:#417690;color:#fff;">
        <h5 class="modal-title">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: text-bottom;">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
          </svg>
          {% trans "Barcode Labels" %}
          <span style="font-weight:400;opacity:.8;font-size:13px;margin-left:8px;">({{ items_count }} {% trans "items" %})</span>
        </h5>
        <button type="button" class="btn-close btn-close-white" aria-label="{% trans "Close" %}" onclick="closeBarcodeModal()"></button>
      </div>
      <div class="modal-body">
        <div style="display:flex;gap:12px;align-items:center;margin-bottom:16px;">
          <strong style="font-size:14px;">{% trans "Format selection" %}</strong>
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;background:#f8f9fa;padding:6px 14px;border-radius:6px;border:1px solid #dee2e6;">
            <input type="checkbox" id="compact-format" onchange="toggleCompactFormat()">
            <span>{% trans "Compact format" %}</span>
            <span style="color:#6c757d;font-size:11px;">(40mm × 15mm)</span>
          </label>
        </div>
        <div id="barcode-content" style="min-height:300px;background:#fff;">
          <div style="text-align:center;padding:60px;color:#6c757d;">
            {% trans "Loading..." %}
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeBarcodeModal()">{% trans "Cancel" %}</button>
        <button type="button" class="btn btn-outline-primary" onclick="window.open(currentUrl, '_blank')">
          {% trans "Open in new tab" %}
        </button>
        <button type="button" class="btn btn-primary" onclick="printBarcodes()">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:text-bottom;">
            <polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 12H4a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2h-2"></path><rect x="6" y="14" width="12" height="8"></rect>
          </svg>
          {% trans "Print" %}
        </button>
      </div>
    </div>
  </div>
</div>

<script>
const baseUrl = '{{ barcode_url }}';
let currentUrl = baseUrl;

function loadBarcodes(url) {
  currentUrl = url;
  const div = document.getElementById('barcode-content');
  div.innerHTML = '<div style="text-align:center;padding:60px;color:#6c757d;">{% trans "Loading..." %}</div>';
  fetch(url)
    .then(r => r.text())
    .then(html => {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const grid = doc.querySelector('.label-grid');
      if (grid) {
        document.querySelectorAll('style[data-barcode]').forEach(s => s.remove());
        doc.querySelectorAll('style').forEach(s => {
          const el = document.createElement('style');
          el.setAttribute('data-barcode', 'true');
          el.textContent = s.textContent;
          document.head.appendChild(el);
        });
        div.innerHTML = '';
        div.appendChild(grid.cloneNode(true));
      } else {
        div.innerHTML = '<div style="text-align:center;padding:60px;color:#dc3545;">{% trans "Failed to load barcodes" %}</div>';
      }
    })
    .catch(() => {
      div.innerHTML = '<div style="text-align:center;padding:60px;color:#dc3545;">{% trans "Error loading barcodes" %}</div>';
    });
}

function toggleCompactFormat() {
  const url = new URL(baseUrl, window.location.origin);
  if (document.getElementById('compact-format').checked) {
    url.searchParams.set('format', 'compact');
  } else {
    url.searchParams.delete('format');
  }
  loadBarcodes(url.toString());
}

loadBarcodes(baseUrl);

function closeBarcodeModal() {
  document.getElementById('barcode-modal').style.display = 'none';
  window.location.href = '{% url "admin:inventory_inventoryitem_changelist" %}';
}

function printBarcodes() {
  const w = window.open('', '_blank');
  w.document.write('<!DOCTYPE html><html><head><title>{% trans "Print Barcodes" %}</title>');
  document.querySelectorAll('style[data-barcode]').forEach(s => w.document.write(s.outerHTML));
  w.document.write('</head><body>'+document.getElementById('barcode-content').innerHTML+'</body></html>');
  w.document.close();
  w.print();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeBarcodeModal(); });
document.getElementById('barcode-modal').addEventListener('click', function(e) { if (e.target === this) closeBarcodeModal(); });
</script>
{% endblock %}
